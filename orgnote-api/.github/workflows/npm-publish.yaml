name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to publish'
        required: false
        default: ''
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, dev]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.ref }}

      - name: Check if release was created
        id: check_release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE=$(gh release view "$VERSION" --json tagName 2>/dev/null || echo "")
          if [ -n "$RELEASE" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION exists, will publish"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No release for $VERSION, skipping publish"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.check_release.outputs.should_publish == 'true'
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        if: steps.check_release.outputs.should_publish == 'true'
        with:
          bun-version: 1.1.45

      - name: Update npm
        if: steps.check_release.outputs.should_publish == 'true'
        run: npm install -g npm@11.11

      - name: Verify trusted publishing auth
        if: steps.check_release.outputs.should_publish == 'true'
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "Unexpected npm token present; remove NODE_AUTH_TOKEN/NPM_TOKEN."
            exit 1
          fi
          TOKEN_VALUE="$(npm config get _authToken 2>/dev/null || true)"
          if [ -n "$TOKEN_VALUE" ] && [ "$TOKEN_VALUE" != "undefined" ] && [ "$TOKEN_VALUE" != "null" ]; then
            echo "Unexpected npmrc auth token present; remove _authToken."
            exit 1
          fi

      - name: Install dependencies
        if: steps.check_release.outputs.should_publish == 'true'
        run: bun install

      - name: Build package
        if: steps.check_release.outputs.should_publish == 'true'
        run: bun run prepub

      - name: Publish to NPM
        if: steps.check_release.outputs.should_publish == 'true'
        working-directory: ./dist
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npmrc-global
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          env -u NODE_AUTH_TOKEN -u NPM_TOKEN npm publish --provenance --access public --registry https://registry.npmjs.org
