name: Bug Report
description: Create a report to help us improve
labels: "bug"
body:
  - type: checkboxes
    id: requirements
    attributes:
      label: Before submitting
      options:
        - label: I am using the latest version of OrgNote
          required: true
        - label: I checked for existing issues with the same problem
          required: true
        - label: I read the [Wiki](https://github.com/Artawower/orgnote/wiki)
          required: false

  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: Describe the bug and the steps to reproduce it
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: debug-info
    attributes:
      label: Debug info
      description: Paste debug info if available (helps investigate faster)
    validations:
      required: false
