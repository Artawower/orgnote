name: API docs

on:
  push:
    branches: [master]
    paths:
      - orgnote-api/**
      - .github/workflows/api-docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orgnote-api/docs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Install docs dependencies
        run: bun install
      - name: Build docs
        run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: orgnote-api/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
