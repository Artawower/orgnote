name: Client deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment name (dev or deploy)'
      image_tag:
        required: true
        type: string
        description: 'Docker image tag (dev or latest)'

permissions:
  contents: read

jobs:
  push-image:
    name: Push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: orgnote-client
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - name: Init environment
        run: |
          cat <<EOT > .env.build
          DEBUG=${{ inputs.environment == 'dev' && 'true' || 'false' }}
          VITE_API_URL=${{ secrets.API_URL }}
          VITE_AUTH_URL=${{ secrets.AUTH_URL }}
          VITE_WS_URL=${{ secrets.WS_URL }}
          VITE_SOURCEMAP=${{ inputs.environment == 'dev' && 'true' || 'false' }}
          VITE_DEPLOYMENT_ENV=${{ inputs.environment }}
          EOT
      - name: Build SSR
        run: bunx env-cmd -f ./.env.build bun run build -m ssr
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: orgnote-client
          file: orgnote-client/deploy/Dockerfile.ssr
          push: true
          tags: orgnote/client:${{ inputs.image_tag }}

  deploy-backend:
    name: Redeploy backend
    needs: [push-image]
    uses: ./.github/workflows/backend-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      debug: ${{ inputs.environment == 'dev' }}
      client_image_tag: ${{ inputs.image_tag }}
    secrets: inherit
