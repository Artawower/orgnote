name: CD orgnote client (stable release)

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  stable-release:
    name: Build and publish stable release
    uses: ./.github/workflows/release.yaml
    with:
      environment: deploy
      tag_prefix: ''
      version_suffix: ''
      release_name_prefix: 'OrgNote '
      prerelease: false
      publish_google_play: true
      update_channel: latest
      enable_devtools: false
      cleanup_old_dev_releases: false
      skip_existing: true
    secrets: inherit
